        <fieldset>  
            <legend><strong>Qui êtes vous&nbsp;?</strong></legend>
            <em>Sexe</em>&nbsp;:&nbsp;

            <div class="radiopetit"> <!--div qui permet d'empiler les radio à cocher quand écran trop petit-->
            <input type="radio" name="sexe" required="required" value="Homme"id="homme"> 
            <label for="homme">Homme </label>
            </div>

            <div class="radiopetit">
            <input type="radio" name="sexe" value="Femme" id="femme">
            <label for="femme">Femme</label>
            </div>

            <br/>

            <label for="Nom"> Nom&nbsp;:&nbsp;</label>                                
            <input type="text" placeholder="DUPOND (en majuscule)" pattern="^[A-Z]+$" name=nom id="Nom" maxlength="50" required="required"> <!--regex pour forcer maj-->

            <br/>

            <label for="prenom">Prénom&nbsp;:&nbsp;</label>
            <input type="text" placeholder="Daniel" name="prenom" id="prenom" maxlength="50" required="required">

            <br/>

            <label for="age"> &Acirc;ge (&nbsp;&ge;&nbsp;18)&nbsp;:&nbsp;</label>
            <input type="number" name="age" id="age" min="18" max="120" required="required" pattern="^[0-9]{1,3}$"> <!--regex pour forcer nombre entre 0 et 3 chiffres et éviter les virgules-->

            <br/>

            <label for="email"> Email&nbsp;:&nbsp;</label>
            <input type="email" placeholder="daniel.dupond@mandarine.fr"name=email id=email required="required" pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$"> <!--regex qui correspond à la majorité des adresses email-->

            <br/>

            <div class="radiopetit">

             <input type="radio" name="avoircompte" value="non" id="non">
